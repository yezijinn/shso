name: 在线编译 APK（自定义包名）

# 用户在 GitHub 仓库页面：Actions → 该工作流 → Run workflow
# 表单中必须填写自己的 APP 包名（applicationId），工作流直接按该包名编译并导出 APK。
# 禁止填写作者原包名 com.mixradio.droid / com.mixradio.*，违者校验失败。
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'APP 包名（applicationId），例如 com.user.myapp。禁止填写 com.mixradio.droid 或 com.mixradio.*'
        required: true
        default: ''
      artifact_retention_days:
        description: '产物保留天数（默认 30，最长 90）'
        required: false
        default: '30'

permissions:
  contents: read
  # upload-artifact@v7 依赖 Actions Artifacts API，必须授予 actions: write，
  # 否则最后一步会报 "Resource not accessible by integration" 而失败。
  actions: write

jobs:
  build:
    name: 编译并导出 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.1

      - name: 校验输入
        id: validate
        # 表单值经 env 传入而非直接插值进脚本：输入含 `$()` / 反引号时不会被 shell 执行。
        env:
          INPUT_PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          INPUT_RETENTION_DAYS: ${{ github.event.inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          PKG="$INPUT_PACKAGE_NAME"
          if [ -z "$PKG" ]; then
            echo "::error::必须填写 APP 包名（package_name）"
            exit 1
          fi
          # 禁止复用作者原包名
          if [ "$PKG" = "com.mixradio.droid" ] || [[ "$PKG" == com.mixradio.* ]]; then
            echo "::error::禁止使用作者原包名（$PKG）。请填写你自己独有的包名，例如 com.user.myapp"
            exit 1
          fi
          # 合法包名：小写字母/数字/下划线，至少两段，每段以字母开头
          if [[ ! "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::包名格式非法：$PKG（示例：com.user.myapp）"
            exit 1
          fi
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          # 保留天数：upload-artifact 只接受 1~90 的整数，非法值要到最后一步上传时才报错，
          # 前面几十步白跑。此处前置校验，留空回退默认 30。
          DAYS="${INPUT_RETENTION_DAYS:-30}"
          if [[ ! "$DAYS" =~ ^[0-9]+$ ]] || (( DAYS < 1 || DAYS > 90 )); then
            echo "::error::artifact_retention_days 必须是 1~90 的整数，当前为：$INPUT_RETENTION_DAYS"
            exit 1
          fi
          echo "retention=$DAYS" >> "$GITHUB_OUTPUT"

      - name: 配置 JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # 不装已下架的 tools 包（默认会安装它并以 exit 1 失败）；
          # 平台与 build-tools 由 Gradle 在 assembleRelease 时按已接受的许可自动拉取。
          packages: platform-tools

      - name: 接受 Android SDK 许可
        run: |
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      # 兼容 setup-android 各版本的环境变量命名（ANDROID_HOME / ANDROID_SDK_ROOT），
      # 显式把 SDK 路径写入 local.properties（已被 gitignore），确保 AGP 一定能定位 SDK。
      - name: 固定 Android SDK 路径
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "使用 Android SDK: $SDK"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 写入 Release 签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # 本工作流的用途是让别人编出自己包名的 APK。Fork 不会继承上游仓库的 Secrets，
          # 缺密钥时退回调试签名继续编译，只有确实提供了密钥才用 Release JKS。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "use_debug_signing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD，产物将使用调试密钥签名"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "use_debug_signing=false" >> "$GITHUB_OUTPUT"

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: 编译 Release APK（按自定义包名）
        # -PoverridePackage 仅覆盖 applicationId（安装身份），namespace/源码包名不变
        # 签名：上一步给出 use_debug_signing 时才传 -PuseDebugSigning=true（缺 Secret 的场景）
        env:
          USE_DEBUG_SIGNING: ${{ steps.signing.outputs.use_debug_signing }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ "$USE_DEBUG_SIGNING" = "true" ]; then
            SIGN_ARGS+=(-PuseDebugSigning=true)
          fi
          ./gradlew assembleRelease \
            -PoverridePackage="${{ steps.validate.outputs.package }}" \
            "${SIGN_ARGS[@]}" \
            --no-configuration-cache

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-release-${{ steps.validate.outputs.package }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ steps.validate.outputs.retention }}

      # 映射表不进 Release（避免降低逆向门槛），仅作 Actions artifact 归档，
      # 供线上崩溃堆栈还原；R8 每次构建的映射不同，事后无法重建。
      - name: 归档混淆映射表
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mapping-${{ steps.validate.outputs.package }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: ${{ steps.validate.outputs.retention }}
