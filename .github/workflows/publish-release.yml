name: 发布 Release（纯日期标签）

# 作者在自己的仓库：Actions → 该工作流 → Run workflow
# 标签强制为纯日期格式（YYYYMMDD，如 20260905），与 APP 内部 versionCode 对齐；
# 「检查更新」功能据此对比本地 versionCode 判断是否需要升级。
# 留空则自动取构建当日日期。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（纯日期 YYYYMMDD，如 20260905）。留空则自动取构建当日日期'
        required: false
        default: ''

permissions:
  contents: write   # 需要推送 tag 并创建 Release

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7.0.1
        with:
          # Release 说明需要「上一个 tag 至今」的提交历史，必须完整拉取（含全部 tag）
          fetch-depth: 0

      - name: 计算发布标签
        id: tag
        run: |
          set -euo pipefail
          T="${{ github.event.inputs.tag }}"
          if [ -z "$T" ]; then T="$(date +%Y%m%d)"; fi
          if [[ ! "$T" =~ ^[0-9]{6,8}$ ]]; then
            echo "::error::标签格式非法：$T（必须为纯数字 YYYYMMDD）"
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      - name: 配置 JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: 接受 Android SDK 许可
        run: |
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      # 兼容 setup-android 各版本的环境变量命名，显式把 SDK 路径写入 local.properties
      - name: 固定 Android SDK 路径
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "使用 Android SDK: $SDK"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 写入 Release 签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 Secret，请上传 Release JKS 的 Base64 内容"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少 KEYSTORE_PASSWORD Secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      # 不带 -PoverridePackage → applicationId 保持作者原包名 com.mixradio.droid
      - name: 编译 Release APK（作者原包名）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          NOTES="$RUNNER_TEMP/release_notes.md"
          {
            echo "## shso $TAG"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| versionName | \`Jinn\` |"
            echo "| versionCode | \`$TAG\`（构建当日日期，也是应用内「检查更新」的判定依据） |"
            echo "| 包名 | \`com.mixradio.droid\` |"
            echo "| 最低系统 | Android 8.0（API 26） |"
            echo
            echo "### 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "（对比 \`$PREV_TAG\` → \`$TAG\`）"
              echo
              git log --no-merges --pretty=format:'- %s' "$PREV_TAG"..HEAD
            else
              echo "（首个 Release）"
              echo
              git log --no-merges --pretty=format:'- %s'
            fi
            echo
            echo
            echo "### 下载"
            echo
            echo "- \`app-release.apk\`：见本页 Assets，下载后传到手机安装即可。"
            echo
            echo "> 更完整的功能说明与更新日志见仓库 [README](https://github.com/yezijinn/shso#readme)。"
          } > "$NOTES"
          echo "--- 生成的说明 ---"
          cat "$NOTES"

      - name: 创建 GitHub Release（纯日期标签）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            app/build/outputs/apk/release/*.apk
