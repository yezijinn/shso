# Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 实验开关（构建时会打印 experimental 警告，属预期）：
# gradual.support 让 R8 以渐进模式处理，maxWorkers 限制并发以避免大内存峰值。
android.r8.gradual.support=true
android.r8.maxWorkers=4
android.suppressUnsupportedCompileSdk=37.0
# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Gradle 弃用警告抑制：当前唯一一条弃用来自 AGP 9.2.1 内部的
# VariantManager.createTestComponents → VariantDependenciesBuilder.build，
# 是 AGP 用 Project 对象作依赖符号（项目代码未参与），Gradle 10 起才会变为错误。
# 根治只能升级 AGP，但本机离线缓存缺 AGP 9.4.0 的传递依赖（guava 33.4.0-jre、bouncycastle 1.80.2），
# 待仓库可达后升级并移除此行。需临时复查时用命令行覆盖：./gradlew <task> --warning-mode all
org.gradle.warning.mode=none
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
# Kotlin
kotlin.code.style=official
# MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Native
kotlin.native.binary.smallBinary=true
kotlin.native.ignoreDisabledTargets=true
# Incremental compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.jvm.fir=true
kotlin.incremental.js=true
kotlin.incremental.js.klib=true
kotlin.incremental.native=true
kotlin.incremental.wasm=true
# Experimental target
org.jetbrains.compose.experimental.macos.enabled=true
# Xcode
kotlin.apple.xcodeCompatibility.nowarn=true
xcodeproj=./example/ios/iosApp.xcodeproj

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
