[versions]
agp = "9.2.1"
kotlin = "2.4.0"

androidx-activity = "1.13.0"
androidx-navigationevent = "1.1.2"
androidx-compose-bom = "2026.09.00"
androidx-lifecycle = "2.11.0"

junit4 = "4.13.2"
coreKtx = "1.19.0"
coroutines = "1.10.1"
commonsCompress = "1.27.1"
tukaaniXz = "1.9"
zip4j = "2.11.1"
zstdJni = "1.5.7-16"
# 文本编辑器引擎（MP-Manager 同款）：自绘 CodeEditor View + 行索引增量 Content，源 Maven Central。
# 许可为 LGPL-2.1：仅作库依赖使用，不改动其源码；分发需随附其许可声明。
soraEditor = "0.23.6"

[libraries]
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigationevent = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "androidx-navigationevent" }
# AndroidX Compose（Google Maven 可达，替代已下线的 org.jetbrains.compose.* 制品；导入命名空间不变仍为 androidx.compose.*）
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "tukaaniXz" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

# Sora Editor（LGPL-2.1）：文本编辑器引擎
sora-editor-bom = { module = "io.github.Rosemoe.sora-editor:bom", version.ref = "soraEditor" }
sora-editor = { module = "io.github.Rosemoe.sora-editor:editor" }
# Monarch 语法高亮（引擎，语法定义由本项目内置 JSON 提供）
sora-language-monarch = { module = "io.github.Rosemoe.sora-editor:language-monarch" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" } # AGP
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
