# shso_guard 策略配置
#
# 语法：每行一条 key=value，"#" 开头为注释。
# 路径一律写绝对路径，结尾不要带斜杠。判定前会做归一化（解析 . .. 与符号链接）。
#
# 兼容性提示（已对加载器加固）：
#   - 允许 Windows 记事本保存的 CRLF 行尾（\r 会被自动剥除）。
#   - 允许 key/value 两侧有空白，如 "protect = /system"。
#   - 允许行尾内联注释，但 # 前必须有空白，如 "protect=/system # 注释"。
#   - 畸形行（无 =）会被忽略，不会中止加载。
#
# 优先级：allow  >  protect
#   即 allow 命中直接放行，不会再看 protect。这保证 /data/media 能豁免 /data 的保护。
#
# 修改后即时生效（无需重启），守卫每次调用都会重新读取本文件。

# 运行模式：
#   enforce = 拦截并记录（默认，推荐）
#   log     = 只记录不拦截（观察期用）
#   off     = 完全放行，守卫只做透传（仅供排障）
# 注意：未知 / 留空的 mode 会被加载器 fail-closed 回退为 enforce。
mode=enforce

# 受保护路径：命中即拦截。
# 注意 "/" 只做精确匹配（只拦 rm -rf / 这种），不会误伤其他绝对路径。
protect=/
protect=/system
protect=/system_ext
protect=/product
protect=/vendor
protect=/odm
protect=/apex
protect=/proc
protect=/sys
protect=/dev
# /data 整体保护：rm -rf /data 等于清空用户数据，必须拦。
# 正常使用不受影响——下面的 allow 会先命中 /data/media、/data/adb/shso。
protect=/data
protect=/data/system
protect=/data/misc
protect=/metadata

# 豁免路径：优先级高于 protect
allow=/sdcard
allow=/storage/emulated
allow=/data/media
allow=/data/adb/shso
allow=/data/local/tmp
